<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="mobile-web-app-capable" content="yes">
        <meta name="apple-mobile-web-app-capable" content="yes">
        <link rel="stylesheet" href="css/leaflet.css">
        <link rel="stylesheet" href="css/qgis2web.css">
        <link rel="stylesheet" href="css/fontawesome-all.min.css">
        <link rel="stylesheet" href="css/leaflet.photon.css">
        <style>
        html, body, #map {
            width: 100%;
            height: 100%;
            padding: 0;
            margin: 0;
        }
        </style>
        <title>Potbelly Sculpture GIS Database</title>
    </head>
    <body>
        <div id="map" aria-label="Interactive map of recorded potbelly sculpture sites"></div>
        <script src="js/qgis2web_expressions.js"></script>
        <script src="js/leaflet.js"></script>
        <script src="js/leaflet.rotatedMarker.js"></script>
        <script src="js/leaflet.pattern.js"></script>
        <script src="js/leaflet-hash.js"></script>
        <script src="js/Autolinker.min.js"></script>
        <script src="js/rbush.min.js"></script>
        <script src="js/labelgun.min.js"></script>
        <script src="js/labels.js"></script>
        <script src="js/leaflet.photon.js"></script>
        <script src="data/geoBoundariesCGAZ_ADM0_0.js"></script>
        <script src="data/lokality_1.js"></script>
        <script>
        var map = L.map('map', {
            zoomControl:false, maxZoom:28, minZoom:1
        })
        var hash = new L.Hash(map);
        map.attributionControl.setPrefix('<a href="https://github.com/qgis2web/qgis2web" target="_blank">qgis2web</a> &middot; <a href="https://leafletjs.com" title="A JS library for interactive maps">Leaflet</a> &middot; <a href="https://qgis.org">QGIS</a>');
        var autolinker = new Autolinker({truncate: {length: 30, location: 'smart'}});
        // remove popup's row if "visible-with-data"
        function removeEmptyRowsFromPopupContent(content, feature) {
         var tempDiv = document.createElement('div');
         tempDiv.innerHTML = content;
         var rows = tempDiv.querySelectorAll('tr');
         for (var i = 0; i < rows.length; i++) {
             var td = rows[i].querySelector('td.visible-with-data');
             var key = td ? td.id : '';
             if (td && td.classList.contains('visible-with-data') && feature.properties[key] == null) {
                 rows[i].parentNode.removeChild(rows[i]);
             }
         }
         return tempDiv.innerHTML;
        }
        // modify popup if contains media
        function addClassToPopupIfMedia(content, popup) {
            var tempDiv = document.createElement('div');
            tempDiv.innerHTML = content;
            var imgTd = tempDiv.querySelector('td img');
            if (imgTd) {
                var src = imgTd.getAttribute('src');
                if (/\.(jpg|jpeg|png|gif|bmp|webp|avif)$/i.test(src)) {
                    popup._contentNode.classList.add('media');
                    var img = popup._contentNode.querySelector('td img');
                    if (img) {
                        // If already loaded (cache), update immediately
                        if (img.complete && img.naturalHeight > 0) {
                            popup.update();
                        } else {
                            img.addEventListener('load', function() {
                                popup.update();
                            });
                            img.addEventListener('error', function() {
                                popup.update();
                            });
                        }
                    }
                } else if (/\.(mp3|wav|ogg|aac)$/i.test(src)) {
                    var audio = document.createElement('audio');
                    audio.controls = true;
                    audio.src = src;
                    imgTd.parentNode.replaceChild(audio, imgTd);
                    popup._contentNode.classList.add('media');
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else if (/\.(mp4|webm|ogg|mov)$/i.test(src)) {
                    var video = document.createElement('video');
                    video.controls = true;
                    video.src = src;
                    video.style.width = "400px";
                    video.style.height = "300px";
                    video.style.maxHeight = "60vh";
                    video.style.maxWidth = "60vw";
                    imgTd.parentNode.replaceChild(video, imgTd);
                    popup._contentNode.classList.add('media');
                    // Aggiorna il popup quando il video carica i metadati
                    video.addEventListener('loadedmetadata', function() {
                        popup.update();
                    });
                    setTimeout(function() {
                        popup.setContent(tempDiv.innerHTML);
                        popup.update();
                    }, 10);
                } else {
                    popup._contentNode.classList.remove('media');
                }
            } else {
                popup._contentNode.classList.remove('media');
            }
        }
        var zoomControl = L.control.zoom({
            position: 'topleft'
        }).addTo(map);
        var bounds_group = new L.featureGroup([]);
        function setBounds() {
            if (bounds_group.getLayers().length) {
                map.fitBounds(bounds_group.getBounds());
            }
            map.setMaxBounds(map.getBounds());
            map.setMinZoom(map.getZoom());
        }
        function pop_geoBoundariesCGAZ_ADM0_0(feature, layer) {
            var popupContent = '<table>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['shapeGroup'] !== null ? autolinker.link(String(feature.properties['shapeGroup']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['shapeType'] !== null ? autolinker.link(String(feature.properties['shapeType']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                    <tr>\
                        <td colspan="2">' + (feature.properties['shapeName'] !== null ? autolinker.link(String(feature.properties['shapeName']).replace(/'/g, '\'').toLocaleString()) : '') + '</td>\
                    </tr>\
                </table>';
            var content = removeEmptyRowsFromPopupContent(popupContent, feature);
			layer.on('popupopen', function(e) {
				addClassToPopupIfMedia(content, e.popup);
			});
			layer.bindPopup(content, { maxHeight: 400 });
        }

        function style_geoBoundariesCGAZ_ADM0_0_0() {
            return {
                pane: 'pane_geoBoundariesCGAZ_ADM0_0',
                opacity: 1,
                color: 'rgba(35,35,35,1.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1.0, 
                fillOpacity: 0,
                interactive: true,
            }
        }
        map.createPane('pane_geoBoundariesCGAZ_ADM0_0');
        map.getPane('pane_geoBoundariesCGAZ_ADM0_0').style.zIndex = 400;
        map.getPane('pane_geoBoundariesCGAZ_ADM0_0').style['mix-blend-mode'] = 'normal';
        var layer_geoBoundariesCGAZ_ADM0_0 = new L.geoJson(json_geoBoundariesCGAZ_ADM0_0, {
            attribution: '',
            interactive: true,
            dataVar: 'json_geoBoundariesCGAZ_ADM0_0',
            layerName: 'layer_geoBoundariesCGAZ_ADM0_0',
            pane: 'pane_geoBoundariesCGAZ_ADM0_0',
            onEachFeature: pop_geoBoundariesCGAZ_ADM0_0,
            style: style_geoBoundariesCGAZ_ADM0_0_0,
        });
        bounds_group.addLayer(layer_geoBoundariesCGAZ_ADM0_0);
        map.addLayer(layer_geoBoundariesCGAZ_ADM0_0);
        function formatPopupValue(value) {
            return value !== null && value !== undefined
                ? autolinker.link(String(value).replace(/'/g, '\'').toLocaleString())
                : '';
        }
        function pop_lokality_1(feature, layer) {
            var latitude = Number(feature.properties['latitude']).toFixed(4);
            var longitude = Number(feature.properties['longitude']).toFixed(4);
            var popupContent = '<div class="site-popup">\
                    <p class="site-popup-code">' + formatPopupValue(feature.properties['site_id']) + '</p>\
                    <h2>' + formatPopupValue(feature.properties['site_name']) + '</h2>\
                    <dl>\
                        <div>\
                            <dt>Country</dt>\
                            <dd>' + formatPopupValue(feature.properties['country']) + '</dd>\
                        </div>\
                        <div>\
                            <dt>Recorded monuments</dt>\
                            <dd>' + formatPopupValue(feature.properties['n_monuments']) + '</dd>\
                        </div>\
                        <div>\
                            <dt>Location precision</dt>\
                            <dd>' + formatPopupValue(feature.properties['location_precision']) + '</dd>\
                        </div>\
                        <div>\
                            <dt>Coordinates</dt>\
                            <dd>' + latitude + ', ' + longitude + '</dd>\
                        </div>\
                    </dl>\
                </div>';
            layer.on('popupopen', function(e) {
                addClassToPopupIfMedia(popupContent, e.popup);
            });
            layer.bindPopup(popupContent, { maxHeight: 400, minWidth: 240, maxWidth: 320 });
        }

        function style_lokality_1_0(feature) {
            if (feature.properties['n_monuments'] >= 1.000000 && feature.properties['n_monuments'] <= 1.000000 ) {
                return {
                pane: 'pane_lokality_1',
                radius: 9.879999999999999,
                opacity: 1,
                color: 'rgba(0,0,0,0.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(231,212,178,0.27450980392156865)',
                interactive: true,
            }
            }
            if (feature.properties['n_monuments'] >= 2.000000 && feature.properties['n_monuments'] <= 3.000000 ) {
                return {
                pane: 'pane_lokality_1',
                radius: 15.2,
                opacity: 1,
                color: 'rgba(0,0,0,0.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(216,169,116,0.27450980392156865)',
                interactive: true,
            }
            }
            if (feature.properties['n_monuments'] >= 4.000000 && feature.properties['n_monuments'] <= 6.000000 ) {
                return {
                pane: 'pane_lokality_1',
                radius: 21.279999999999998,
                opacity: 1,
                color: 'rgba(0,0,0,0.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(196,131,76,0.27450980392156865)',
                interactive: true,
            }
            }
            if (feature.properties['n_monuments'] >= 7.000000 && feature.properties['n_monuments'] <= 11.000000 ) {
                return {
                pane: 'pane_lokality_1',
                radius: 28.12,
                opacity: 1,
                color: 'rgba(0,0,0,0.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(168,89,45,0.27450980392156865)',
                interactive: true,
            }
            }
            if (feature.properties['n_monuments'] >= 12.000000 && feature.properties['n_monuments'] <= 17.000000 ) {
                return {
                pane: 'pane_lokality_1',
                radius: 34.959999999999994,
                opacity: 1,
                color: 'rgba(0,0,0,0.0)',
                dashArray: '',
                lineCap: 'butt',
                lineJoin: 'miter',
                weight: 1,
                fill: true,
                fillOpacity: 1,
                fillColor: 'rgba(128,55,30,0.27450980392156865)',
                interactive: true,
            }
            }
        }
        map.createPane('pane_lokality_1');
        map.getPane('pane_lokality_1').style.zIndex = 401;
        map.getPane('pane_lokality_1').style['mix-blend-mode'] = 'normal';
        var layer_lokality_1 = new L.geoJson(json_lokality_1, {
            attribution: '',
            interactive: true,
            dataVar: 'json_lokality_1',
            layerName: 'layer_lokality_1',
            pane: 'pane_lokality_1',
            onEachFeature: pop_lokality_1,
            pointToLayer: function (feature, latlng) {
                var context = {
                    feature: feature,
                    variables: {}
                };
                return L.circleMarker(latlng, style_lokality_1_0(feature));
            },
        });
        bounds_group.addLayer(layer_lokality_1);
        map.addLayer(layer_lokality_1);
        setBounds();
        var i = 0;
        layer_lokality_1.eachLayer(function(layer) {
            var context = {
                feature: layer.feature,
                variables: {}
            };
            layer.bindTooltip((exp_label_lokality_1_eval_expression(context) !== null?String('<div style="color: #3c2819; font-size: 11pt; font-weight: bold; font-family: \'Arial\', sans-serif;">' + exp_label_lokality_1_eval_expression(context)) + '</div>':''), {permanent: true, offset: [-0, -16], className: 'css_lokality_1'});
            labels.push(layer);
            totalMarkers += 1;
              layer.added = true;
              addLabel(layer, i);
              i++;
        });
        resetLabels([layer_geoBoundariesCGAZ_ADM0_0,layer_lokality_1]);
        map.on("zoomend", function(){
            resetLabels([layer_geoBoundariesCGAZ_ADM0_0,layer_lokality_1]);
        });
        map.on("layeradd", function(){
            resetLabels([layer_geoBoundariesCGAZ_ADM0_0,layer_lokality_1]);
        });
        map.on("layerremove", function(){
            resetLabels([layer_geoBoundariesCGAZ_ADM0_0,layer_lokality_1]);
        });
        </script>        
    </body>
</html>
