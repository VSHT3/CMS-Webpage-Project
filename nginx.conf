server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Serve clean URLs without 301 redirect (preserves View Transitions on SPA nav)
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  # Long cache for hashed assets
  location ~* ^/(_astro|assets)/.+\.(js|css|woff2?|webp|avif|jpg|jpeg|png|gif|svg|glb)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Temporarily withheld PDFs. Astro also uses these exact-match locations to hide PDF links.
  # In the Shadow of Xibalba
  location = /assets/pdfs/publications/in-the-shadow-of-xibalba.pdf {
    add_header Cache-Control "no-store" always;
    return 404;
  }
  location = /pdfs/In-the-Shadow-of-Xibalba.-Maya-caves-and-underground-landscapes-2.pdf {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  # In the Realm of Maize God
  location = /assets/pdfs/publications/in-the-realm-of-the-maize-god.pdf {
    add_header Cache-Control "no-store" always;
    return 404;
  }
  location = /pdfs/In_the_realm_Maize_god_final.pdf {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  # Excavaciones en el Petén Noreste VII
  location = /assets/pdfs/reports/uaxactun/uaxactun-2025.pdf {
    add_header Cache-Control "no-store" always;
    return 404;
  }
  location = /pdfs/INFORME_2025.pdf {
    add_header Cache-Control "no-store" always;
    return 404;
  }

  # PDFs: short cache, allow inline display
  location ~* \.pdf$ {
    expires 1d;
    add_header Cache-Control "public";
  }

  # Don't cache HTML
  location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-store";
  }
}
