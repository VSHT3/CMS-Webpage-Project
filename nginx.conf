server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Serve clean URLs without 301 redirect (preserves View Transitions on SPA nav)
  location / {
    try_files $uri $uri.html $uri/index.html =404;
  }

  # Long cache for hashed assets
  location ~* ^/(_astro|assets)/.+\.(js|css|woff2?|webp|avif|jpg|jpeg|png|gif|svg|glb)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # PDFs: short cache, allow inline display
  location ~* \.pdf$ {
    expires 1d;
    add_header Cache-Control "public";
  }

  # Don't cache HTML
  location ~* \.html$ {
    expires -1;
    add_header Cache-Control "no-store";
  }
}
